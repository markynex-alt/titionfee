name: tuition_fee
description: Tuition fee management app
publish_to: "none"

version: 1.1.0+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  google_fonts: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.4.0
  fl_chart: ^0.66.0
  intl: ^0.19.0
  collection: ^1.17.0

  firebase_core: ^3.15.2       # latest 3.x stable
  firebase_auth: ^5.3.0        # compatible with firebase_core 3.x
  cloud_firestore: ^5.6.12     # compatible with firebase_core 3.x
  google_sign_in: 6.1.6
  connectivity_plus: ^7.0.0
  flutter_launcher_icons: ^0.13.1




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
